<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperactive Toggle with jQuery</title>
    <style>
        .highlight {
            background-color: yellow;
            font-weight: bold;
            padding: 8px;
            border-radius: 4px;
        }
    </style>

    <script src ="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>Imperative Approach (jQuery)</h1>
    <p id="'paragraph">This paragraph will be highlighted on button click.</p>
    <button id="toggleBtn">Toggle Highlight</button>
</body>
</html>
